<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git Switcher</title>
    <script>
      // Apply theme before first paint to prevent FOUC
      (function () {
        var saved = localStorage.getItem("git-switcher-theme");
        var isDark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) document.documentElement.classList.add("dark");
        // The summoned terminal window draws its own rounded shell; the page
        // background must stay transparent so the corners show the desktop.
        if (new URLSearchParams(location.search).get("window") === "terminal") {
          document.documentElement.classList.add("terminal-window");
        }
        // Resolve the interface language before first paint too: <html lang> must
        // never be wrong, and translated text must never flash another locale.
        // Mirrors resolveInitialLanguage() in src/lib/i18n.ts; the language list
        // and the storage key are checked by scripts/check-i18n.mjs.
        var language = localStorage.getItem("git-switcher-language");
        if (language !== "en" && language !== "zh-CN") {
          var tags = navigator.languages || [navigator.language || ""];
          language = "en";
          for (var i = 0; i < tags.length; i++) {
            var tag = String(tags[i]).toLowerCase();
            if (tag === "zh" || tag.indexOf("zh-") === 0) { language = "zh-CN"; break; }
            if (tag === "en" || tag.indexOf("en-") === 0) { language = "en"; break; }
          }
        }
        document.documentElement.lang = language;
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
